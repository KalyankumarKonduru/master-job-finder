# How often to poll (minutes). A little random jitter is added.
poll_interval_minutes: 2      # fixed rate: cycle time counts toward this
jitter_seconds: 10            # small random offset so polls aren't perfectly clockwork
max_parallel: 12
# Cap alerts per company per cycle. Anything past the cap arrives as one digest
# message of links instead of N separate alerts. 0 = no cap.
max_alerts_per_company: 12

# Visa sponsorship screening. The job description is fetched BEFORE the alert, so a
# posting that rules out sponsorship never reaches Discord and is never tailored.
skip_no_sponsorship: true
on_unknown_sponsorship: alert   # 'alert' keeps unclear postings; 'skip' drops them too

# Skip postings whose REQUIRED section asks for more than this many years. Preferred
# and nice-to-have sections are ignored. Leave blank to turn the screen off.
max_years_experience: 5

# Only alert, and only build a resume, when the posting scores at least this against
# your bullet bank. Scoring costs one API call per new match, so alerts now wait on
# that call - see "Score gate" in the README. Remove this line to alert on everything.
min_match_score: 65          # boards fetched concurrently

# Title filters are regexes matched against a NORMALIZED title:
# lowercase, "sr." -> "senior", "full-stack"/"fullstack" -> "full stack", punctuation -> spaces.
titles:
  include:
    - '\bsoftware (development )?engineer'
    - '\b(software|application|applications|engineering|java|python|net|cloud|full stack|back end|backend|front end|frontend) developer'
    - '\bswe\b'
    - '\bsoftware dev(elopment)? engineer'      # Amazon: "Software Dev Engineer II"
    - '\bsde\b'
    - '\bfull stack (software )?engineer'
    - '\b(back end|backend|front end|frontend) engineer'
    - '\bcloud (infrastructure |platform |devops |software )?engineer'
    - '\bapplications? engineer'
    - '\bprogrammer analyst'            # Citi's classic SWE title
    - '^(senior |lead )?engineer( [iv]+)?\b'   # AmEx-style "Engineer III", "Sr. Engineer"
    # - '\bsite reliability engineer'
    # - '\b(ai|agentic ai|ml|machine learning) engineer'
  exclude:
    - '\bintern(ship)?\b'
    - '\bapprentice'
    - '\bsummer analyst\b'
    - '\bmanager\b'
    - '\bdirector\b'
    - '\bprincipal\b'
    - '\bdistinguished\b'
    - '\bsales engineer'
    - '\b(qa|quality|test|testing)\b.*\bengineer'
    - '\bin test\b'
    - '\bdata center\b'
    # NOTE: VP / AVP / Associate are NOT excluded - at banks these are rank titles
    # on regular engineering roles (e.g. "Software Engineer - VP").
    # - '\bstaff\b'

# Resume tailoring. Runs after alerts go out, so it never delays a notification.
# Needs ANTHROPIC_API_KEY. Output lands in ./applications/<Company>__<Title>__<id>/
tailor:
  enabled: true
  templates_dir: ~/Downloads/comet   # folder holding your master resume .docx files
  # Only these files are treated as master templates. Without this, every .docx in the
  # folder joins the bullet bank - including resumes this tool generated earlier.
  templates_include:
    - "KALYANKUMAR_KONDURU_BACKEND.docx"
    - "KALYANKUMAR_KONDURU_CLOUD_DEVOPS.docx"
    - "KALYANKUMAR_KONDURU_FRONTEND.docx"
    - "KALYANKUMAR_KONDURU_FULLSTACK.docx"
  max_tokens: 16000             # reasoning tokens count against this; unused ceiling costs nothing
  model: claude-haiku-4-5-20251001        #  claude-sonnet-5 is cheaper/faster
  max_per_cycle: 5              # cap postings SCORED per poll; the rest wait a cycle
  only_new: true                # tailor only jobs found in THIS cycle. false makes every
                                # cycle also chew through the backlog of older matches.
  compact: true                 # tighten margins and paragraph gaps to fit one page
  line_spacing: 1.15            # applied to every paragraph, overriding template styles
  output_dir: applications
  page_budget:                  # bullets kept per block; these four sum to 26
    achievements: 5             # 19 was the one-page max at 1.15 spacing, so 26 will
                                # run onto a second page - check a generated .docx
    community dreams foundation: 8
    medical informatics engineering: 7
    accenture: 6

