<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Live Preview</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1d2330; --muted: #6b7385; --line: #e3e6ec;
  --accent: #4f46e5; --ok: #15803d; --ok-bg: #dcfce7; --warn: #b45309; --warn-bg: #fef3c7;
  --bad: #b91c1c; --bad-bg: #fee2e2; --ask-bg: #fff3b0; --pref: #2563eb; --pref-bg: #dbeafe;
  --chip: #eef0f4; --focus: #f59e0b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --panel: #171b23; --ink: #e6e8ee; --muted: #8a93a6; --line: #262c38;
    --accent: #818cf8; --ok: #4ade80; --ok-bg: #14321f; --warn: #fbbf24; --warn-bg: #3a2a0c;
    --bad: #f87171; --bad-bg: #3b1515; --ask-bg: #4a3f0b; --pref: #93c5fd; --pref-bg: #172554;
    --chip: #222836;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 15px; white-space: nowrap; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 8px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live.on { color: var(--bad); } .live.on i { background: var(--bad); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
select { font: inherit; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); max-width: 520px; min-width: 0; flex: 1 1 260px; }
.controls { display: flex; gap: 4px; align-items: center; }
button { font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .45; cursor: default; }
#scorebox { margin-left: auto; text-align: right; line-height: 1.15; }
#scorebox b { font-size: 26px; }
#scorebox small { display: block; color: var(--muted); font-size: 11.5px; }
#rail { display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--line); }
.step { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: 12.5px; white-space: nowrap; transition: background .3s, color .3s; }
.step b { font-weight: 600; }
.step.active { background: var(--accent); color: #fff; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.step.done { background: var(--ok-bg); color: var(--ok); }
.step.skip { background: var(--chip); color: var(--muted); text-decoration: line-through; }
.step.fail { background: var(--bad-bg); color: var(--bad); }
.step .t { font-variant-numeric: tabular-nums; opacity: .85; }
main { flex: 1; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 12px; padding: 12px; min-height: 0; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.jdhead { padding: 12px 16px 6px; }
.jdhead h2 { margin: 0; font-size: 17px; }
.jdhead .sub { color: var(--muted); font-size: 12.5px; }
.jdhead a { color: var(--accent); }
#terms { padding: 6px 16px 10px; display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); max-height: 34%; overflow: auto; }
.label { width: 100%; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 4px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; background: var(--chip); border: 1px solid transparent; cursor: default; transition: background .4s, color .4s; }
.chip small { font-size: 10.5px; opacity: .8; }
.chip.asked { background: var(--ask-bg); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.gap { background: var(--warn-bg); color: var(--warn); }
.chip.missing { background: var(--bad-bg); color: var(--bad); }
.chip.pref { background: var(--pref-bg); color: var(--pref); }
.chip.byeye { background: var(--chip); color: var(--muted); border: 1px dashed var(--line); }
.chip.struck { text-decoration: line-through; color: var(--muted); }
.chip.hot { border-color: var(--focus); }
#jd { flex: 1; overflow: auto; padding: 12px 16px; white-space: pre-wrap; font-size: 13px; color: var(--ink); }
#feed code { word-break: break-all; }
#feed { border-top: 1px solid var(--line); max-height: 30%; overflow: auto; padding: 8px 16px 12px; font-size: 12.5px; }
.ev { padding: 4px 0; border-bottom: 1px dashed var(--line); animation: fadein .35s ease; }
.ev:last-child { border-bottom: 0; }
.ev .at { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
.ev ul { margin: 3px 0 0 18px; padding: 0; color: var(--muted); }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } }
mark { background: var(--ask-bg); color: inherit; border-radius: 3px; padding: 0 1px; transition: background .4s, box-shadow .2s; }
mark.ok { background: var(--ok-bg); }
mark.gap { background: var(--warn-bg); }
mark.missing { background: var(--bad-bg); }
mark.pref { background: transparent; box-shadow: inset 0 -2px 0 var(--pref); }
mark.hot { box-shadow: 0 0 0 2px var(--focus); }
.tabs { display: flex; gap: 6px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#coverage { margin-left: auto; font-size: 12.5px; color: var(--muted); }
#coverage b { color: var(--ink); }
#stage { font-size: 12.5px; color: var(--muted); }
#paperwrap { flex: 1; overflow: auto; padding: 18px; background: color-mix(in srgb, var(--bg) 70%, var(--panel)); }
.paper { background: #fff; color: #111; width: 100%; max-width: 760px; margin: 0 auto; padding: 34px 40px; box-shadow: 0 2px 14px rgba(0,0,0,.12); border-radius: 3px; font: 12px/1.38 Calibri, Carlito, "Segoe UI", Arial, sans-serif; min-height: 600px; }
.paper .sec { font-weight: 700; font-size: 12.5px; letter-spacing: .05em; border-bottom: 1px solid #222; margin: 12px 0 5px; padding-bottom: 1px; }
.paper .sec:first-child { margin-top: 0; }
.paper .basebadge { float: right; font-weight: 400; font-size: 10.5px; color: #777; letter-spacing: 0; }
.paper .skills { margin: 0 0 2px; }
.paper .pad { background: #dcfce7; border-radius: 3px; padding: 0 2px; }
.paper .job { margin: 8px 0 2px; display: flex; justify-content: space-between; gap: 10px; }
.paper .job .meta { color: #666; font-size: 11px; white-space: nowrap; }
.paper .count { color: #888; font-size: 10.5px; font-weight: 400; margin-left: 6px; }
.paper ul { margin: 2px 0 4px; padding-left: 16px; }
.paper li { margin: 1px 0; padding: 0 3px; border-radius: 3px; transition: background 1.2s; }
.paper li mark { background: #fff3b0; }
.paper li mark.ok { background: #bbf7d0; }
.paper li.added { animation: added 2.4s ease; }
.paper li.moved { animation: moved 2.4s ease; }
.paper li.shifted { animation: shifted 1.6s ease; }
.paper li.removed { color: #b91c1c; text-decoration: line-through; animation: removed 2s ease forwards; }
@keyframes added { 0% { background: #86efac; transform: translateX(-8px); opacity: 0; } 15% { opacity: 1; transform: none; } 100% { background: transparent; } }
@keyframes moved { 0% { background: #c7d2fe; } 100% { background: transparent; } }
@keyframes shifted { 0% { background: #fde68a; } 100% { background: transparent; } }
@keyframes removed { 0% { background: #fecaca; opacity: 1; } 70% { opacity: .6; } 100% { opacity: 0; max-height: 0; } }
.paper .empty { color: #999; font-style: italic; }
.wait { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); height: 100%; text-align: center; padding: 24px; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#real { display: block; max-width: 760px; width: 100%; margin: 0 auto; box-shadow: 0 2px 14px rgba(0,0,0,.12); background: #fff; }
.banner { padding: 8px 16px; background: var(--pref-bg); color: var(--pref); font-size: 12.5px; display: none; }
.banner.show { display: block; }
@media (max-width: 900px) {
  main { grid-template-columns: minmax(0, 1fr); }
  section { min-height: 70vh; }
  .paper { padding: 22px 18px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">Resume builder <span id="live" class="live"><i></i><span>LIVE</span></span></div>
  <select id="runs" aria-label="Posting"></select>
  <div class="controls" id="speeds">
    <button data-speed="0.5">½×</button><button data-speed="1" class="on">1×</button>
    <button data-speed="2">2×</button><button data-speed="4">4×</button>
    <button id="skip" title="Jump to the end">Skip ⏭</button>
    <button id="replay">Replay ↺</button>
  </div>
  <div id="scorebox"></div>
</header>
<div class="banner" id="banner"></div>
<nav id="rail"></nav>
<main>
  <section>
    <div class="jdhead"><h2 id="jtitle">Waiting for a posting…</h2><div class="sub" id="jsub"></div></div>
    <div id="terms"></div>
    <div id="jd"></div>
    <div id="feed"></div>
  </section>
  <section>
    <div class="tabs">
      <button id="tabLive" class="on">Live page</button>
      <button id="tabReal" disabled>Real .docx</button>
      <button id="openWord" disabled>Open in Word</button>
      <span id="stage"></span>
      <span id="coverage"></span>
    </div>
    <div id="paperwrap"><div id="paper" class="paper"></div><img id="real" alt="The finished resume" hidden></div>
  </section>
</main>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const STEPS = [
  ["found", "Posting found"], ["claude", "Claude reads it"], ["terms", "Required terms"],
  ["pick", "Claude's picks"], ["repair", "Coverage repair"], ["variety", "Order + variety"],
  ["fill", "Page fill"], ["final", "Final page"], ["score", "Recruiter score"],
  ["resume", "Resume .docx"], ["discord", "Discord"],
];
const DELAY = { job: 900, plan: 1800, page: 2000, score: 1700, done: 1200, alert: 900, skipped: 900, error: 0 };
const params = new URLSearchParams(location.search);
const S = {
  runs: [], name: null, events: [], next: 0, cursor: 0, speed: Number(params.get("speed")) || 1,
  follow: !params.get("run"), busy: false, instant: false, stopAt: null, pendingFollow: null,
  job: null, plan: null, score: null, terms: [], regexes: [], page: null, pageIdx: {}, pageText: {},
  claudeSince: null, finished: false,
};

// ---------------------------------------------------------------- helpers
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(`${r.status}`);
  return r.headers.get("content-type")?.includes("json") ? r.json() : r;
}
function termRegex(term) {
  const alts = [term, ...(term.includes("/") ? term.split("/") : [])]
    .map((a) => a.trim()).filter((a) => a.length > 0)
    .sort((a, b) => b.length - a.length)
    .map((a) => {
      let core = a.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "[\\s-]+");
      if (/[a-z]s$/.test(a) && a.length > 4 && !/ss$/.test(a)) core = core.slice(0, -1) + "(?:es|s)?";
      else core += "(?:es|s)?";
      return core;
    });
  return new RegExp(`(?<![A-Za-z0-9])(?:${alts.join("|")})(?![A-Za-z0-9])`, "gi");
}
// Wrap every match of the given terms in <mark>, longest match first, no overlaps.
function highlight(text, items) {
  const spans = [];
  for (const { re, i, cls } of items) {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(text))) {
      if (!m[0]) { re.lastIndex++; continue; }
      spans.push([m.index, m.index + m[0].length, i, cls]);
    }
  }
  spans.sort((a, b) => a[0] - b[0] || (b[1] - b[0]) - (a[1] - a[0]));
  let out = "", at = 0;
  for (const [s, e, i, cls] of spans) {
    if (s < at) continue;
    out += esc(text.slice(at, s)) + `<mark class="${cls}" data-t="${i}">${esc(text.slice(s, e))}</mark>`;
    at = e;
  }
  return out + esc(text.slice(at));
}
function secs(ts) {
  if (!S.job || !ts) return "";
  const d = ts - S.job.ts;
  return d < 0.05 ? "+0.0s" : `+${d.toFixed(d < 10 ? 2 : 1)}s`;
}

// ---------------------------------------------------------------- rail + status
function resetRail() {
  $("#rail").innerHTML = STEPS.map(([k, label]) => `<div class="step" id="st-${k}"><b>${label}</b><span class="t"></span></div>`).join("");
}
function mark(key, cls, note) {
  const el = $(`#st-${key}`);
  if (!el) return;
  el.className = `step ${cls}`;
  if (note !== undefined) el.querySelector(".t").textContent = note;
  if (cls === "active") el.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
}
function feed(ts, html, notes) {
  const div = document.createElement("div");
  div.className = "ev";
  const list = (notes || []).filter(Boolean);
  div.innerHTML = `<span class="at">${secs(ts)}</span>${html}` +
    (list.length ? `<ul>${list.slice(0, 12).map((n) => `<li>${esc(n)}</li>`).join("")}${list.length > 12 ? `<li>…and ${list.length - 12} more</li>` : ""}</ul>` : "");
  $("#feed").appendChild(div);
  $("#feed").scrollTop = $("#feed").scrollHeight;
}

// ---------------------------------------------------------------- terms
function termStatus(i) {
  const t = S.terms[i];
  if (S.score) {
    if ((S.score.proven && t in S.score.proven)) return ["ok", "proven"];
    if ((S.score.bank_gaps || []).includes(t)) return ["missing", "no bullet says it"];
    if ((S.score.page_gaps || []).includes(t)) return ["gap", "in bank, not on page"];
    return ["gap", "claim only"];
  }
  if (S.page) return coveredNow().has(i) ? ["ok", "on the page"] : ["asked", "not yet"];
  return ["asked", "asked for"];
}
function coveredNow() {
  const got = new Set();
  for (const b of S.page || []) if (b.proof) for (const x of b.bullets) x.hits.forEach((h) => got.add(h));
  return got;
}
function renderTerms() {
  if (!S.plan) { $("#terms").innerHTML = ""; return; }
  const p = S.plan;
  const req = S.terms.map((t, i) => {
    const [cls, why] = termStatus(i);
    return `<span class="chip ${cls}" data-t="${i}">${i + 1}. ${esc(t)} <small>${why}</small></span>`;
  }).join("");
  const pref = (p.preferred || []).map((t) => `<span class="chip pref">${esc(t)}</span>`).join("");
  const eye = [...(p.meta || []), ...(p.moved || [])].map((t) => `<span class="chip byeye">${esc(t)}</span>`).join("");
  const ign = (p.ignored || []).map((t) => `<span class="chip struck" title="Claude listed it, but the posting never says it">${esc(t)}</span>`).join("");
  $("#terms").innerHTML = `<div class="label">Required — in the posting's own words, most asked-for first</div>${req}` +
    (pref ? `<div class="label">Preferred — shown, never scored</div>${pref}` : "") +
    (eye ? `<div class="label">Check by eye — years, degrees, clauses no bullet can prove</div>${eye}` : "") +
    (ign ? `<div class="label">Dropped — not in the posting's wording</div>${ign}` : "");
  const covered = coveredNow().size;
  if (S.page && !S.score) $("#coverage").innerHTML = `Proven so far <b>${covered}/${S.terms.length}</b>`;
}
function renderJD() {
  if (!S.job) return;
  if (!S.plan) { $("#jd").textContent = S.job.jd || ""; return; }
  const items = S.terms.map((t, i) => ({ re: S.regexes[i], i, cls: termStatus(i)[0] === "asked" ? "" : termStatus(i)[0] }))
    .concat((S.plan.preferred || []).map((t) => ({ re: termRegex(t), i: "p", cls: "pref" })));
  $("#jd").innerHTML = highlight(S.job.jd || "", items);
}

// ---------------------------------------------------------------- the page
function bulletHTML(x) {
  const items = x.hits.map((i) => ({ re: S.regexes[i], i, cls: S.score && S.score.proven && S.terms[i] in S.score.proven ? "ok" : "" }));
  return highlight(x.text, items);
}
function renderPaper(blocks, animate) {
  const prev = S.pageIdx, now = {};
  for (const b of blocks) b.bullets.forEach((x, i) => { now[x.id] = { block: b.block, pos: i }; S.pageText[x.id] = x.text; });
  const p = S.plan || {};
  const padding = (S.score && S.score.padding) || [];
  let html = `<div class="sec">SKILLS <span class="basebadge">base template: ${esc(p.base || "?")}</span></div>`;
  html += (p.skills || []).map((s) => `<p class="skills">${esc(s)}</p>`).join("") || `<p class="skills empty">(skills line from the template)</p>`;
  if (padding.length) html += `<p class="skills">+ <span class="pad">${padding.map(esc).join(" | ")}</span> <span class="count">added: proven by a bullet below</span></p>`;
  let expHeader = false;
  for (const b of blocks) {
    if (b.block === "achievements") html += `<div class="sec">KEY ACHIEVEMENTS <span class="count">${b.bullets.length} · names no employer, so a claim, not proof</span></div>`;
    else {
      if (!expHeader) { html += `<div class="sec">EXPERIENCE</div>`; expHeader = true; }
      const co = (b.company || "").replace(/([a-z])((?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]* \d{4})/, "$1 $2");
      html += `<div class="job"><span><b>${esc(b.title)}</b>${co ? ` — ${esc(co)}` : ""}<span class="count">${b.bullets.length} bullets</span></span><span class="meta">${esc(b.meta || "")}</span></div>`;
    }
    html += "<ul>";
    b.bullets.forEach((x, i) => {
      let cls = "";
      if (animate) {
        const was = prev[x.id];
        cls = !was ? "added" : was.block !== b.block ? "moved" : was.pos !== i ? "shifted" : "";
      }
      html += `<li class="${cls}" data-id="${esc(x.id)}">${bulletHTML(x)}</li>`;
    });
    if (animate) for (const [id, was] of Object.entries(prev)) {
      if (!now[id] && was.block === b.block) html += `<li class="removed">${esc(S.pageText[id] || id)}</li>`;
    }
    html += "</ul>";
  }
  $("#paper").innerHTML = html;
  S.pageIdx = now;
  if (animate) setTimeout(() => document.querySelectorAll(".paper li.removed").forEach((el) => el.remove()), 2100);
}
function diffNotes(blocks) {
  const prev = S.pageIdx, now = new Set();
  let added = 0, moved = 0;
  for (const b of blocks) for (const x of b.bullets) { now.add(x.id); if (!prev[x.id]) added++; else if (prev[x.id].block !== b.block) moved++; }
  const removed = Object.keys(prev).filter((id) => !now.has(id)).length;
  const total = blocks.reduce((n, b) => n + b.bullets.length, 0);
  return { added, removed, moved, total };
}

// ---------------------------------------------------------------- applying steps
function apply(e, animate) {
  switch (e.step) {
    case "job": {
      S.job = e;
      $("#jtitle").textContent = e.title || "Untitled posting";
      $("#jsub").innerHTML = `${esc(e.company)}${e.url ? ` · <a href="${esc(e.url)}" target="_blank" rel="noopener">open posting ↗</a>` : ""} · ${new Date(e.ts * 1000).toLocaleString()}${e.bar != null ? ` · bar ${e.bar}` : ""}`;
      $("#jd").textContent = e.jd || "";
      mark("found", "done", ""); mark("claude", "active", "0s");
      S.claudeSince = e.ts;
      $("#paper").innerHTML = `<div class="wait"><div class="spinner"></div><div>Claude is reading the posting and choosing bullets from your bank…</div></div>`;
      feed(e.ts, `New posting: <b>${esc(e.title)}</b> at ${esc(e.company)}`);
      break;
    }
    case "plan": {
      S.plan = e; S.terms = e.required || []; S.regexes = S.terms.map(termRegex); S.claudeSince = null;
      mark("claude", "done", secs(e.ts)); mark("terms", "done", `${S.terms.length}`); mark("pick", "active");
      renderTerms(); renderJD();
      const extra = [];
      if (e.base_reason) extra.push(`Base template: ${e.base} — ${e.base_reason}`);
      if ((e.ignored || []).length) extra.push(`Dropped (not in the posting's words): ${e.ignored.join(", ")}`);
      if ((e.moved || []).length) extra.push(`Too long to be a search term, check by eye: ${e.moved.join("; ")}`);
      feed(e.ts, `Claude read the posting: <b>${S.terms.length}</b> required terms, ${(e.preferred || []).length} preferred, ${(e.meta || []).length} to check by eye. Semantic fit ${e.semantic ?? "?"}/100.`, extra);
      $("#paper").innerHTML = `<div class="wait"><div class="spinner"></div><div>Assembling the page…</div></div>`;
      break;
    }
    case "page": {
      const d = diffNotes(e.blocks);
      const first = !S.page;
      S.page = e.blocks;
      renderPaper(e.blocks, animate && !first ? true : animate);
      const order = ["pick", "repair", "variety", "fill", "final"];
      const k = order.indexOf(e.stage);
      if (k >= 0) { mark(e.stage, "done", first ? `${d.total}` : (d.added || d.removed ? `+${d.added} −${d.removed}` : "✓")); if (k < order.length - 1) mark(order[k + 1], "active"); else mark("score", "active"); }
      $("#stage").textContent = e.label;
      renderTerms(); renderJD();
      const summary = first ? `${d.total} bullets on the page` : (d.added || d.removed || d.moved) ? `${d.added} added, ${d.removed} removed${d.moved ? `, ${d.moved} re-filed` : ""} — ${d.total} on the page` : `no changes — ${d.total} on the page`;
      feed(e.ts, `<b>${esc(e.label)}</b>: ${summary}. Proven so far ${coveredNow().size}/${S.terms.length}.`, e.notes);
      break;
    }
    case "score": {
      S.score = e;
      const pass = e.passed;
      mark("score", pass ? "done" : "fail", `${e.score}/100`);
      mark("resume", "active");
      $("#scorebox").innerHTML = `<b style="color:var(${pass ? "--ok" : "--bad"})">${e.score ?? "–"}</b><span>/100</span><small>recruiter score · bar ${e.bar ?? "none"} · semantic ${e.semantic ?? "?"}</small>`;
      $("#coverage").innerHTML = `Proven in their words <b>${Object.keys(e.proven || {}).length}/${S.terms.length}</b>`;
      renderTerms(); renderJD();
      if (S.page) renderPaper(S.page, false);
      const notes = [];
      if ((e.page_gaps || []).length) notes.push(`In your bank but not on this page: ${e.page_gaps.join(", ")}`);
      if ((e.bank_gaps || []).length) notes.push(`No bullet anywhere says: ${e.bank_gaps.join(", ")}`);
      if ((e.padding || []).length) notes.push(`Added to SKILLS (each proven by a bullet): ${e.padding.join(", ")}`);
      feed(e.ts, `Recruiter score <b>${e.score}/100</b> — ${pass ? "clears" : "below"} the bar of ${e.bar ?? "none"}.`, notes);
      break;
    }
    case "done": {
      mark("resume", "done", "written"); mark("discord", "active");
      // The watcher sends its alert right after this step; a manual run never does.
      const doneAt = e.ts, run = S.name;
      setTimeout(() => {
        if (S.name !== run || S.finished) return;
        mark("discord", "skip", "not sent"); finish();
      }, Date.now() / 1000 - doneAt > 60 ? 0 : 20000);
      S.docx = e.docx;
      $("#tabReal").disabled = false; $("#openWord").disabled = false;
      feed(e.ts, `Resume written: <code>${esc((e.docx || "").split("/").slice(-2).join("/"))}</code>`);
      break;
    }
    case "skipped": {
      mark("resume", "skip", "not built"); mark("discord", "skip", "no alert");
      feed(e.ts, `Below the bar: no resume is written and nothing goes to Discord. The gaps are still recorded.`);
      finish();
      break;
    }
    case "alert": {
      mark("discord", e.sent ? "done" : "fail", e.sent ? "sent" : "failed");
      feed(e.ts, e.sent ? `Discord: “Resume ready” card sent, linking the posting.` : `Discord: not sent${e.reason ? ` (${esc(e.reason)})` : ""}.`);
      finish();
      break;
    }
    case "error": {
      mark("claude", "fail", "error");
      $("#paper").innerHTML = `<div class="wait">The Claude call failed:<br><code>${esc(e.message)}</code><br>The watcher retries this posting on its next poll.</div>`;
      feed(e.ts, `Error: ${esc(e.message)}`);
      finish();
      break;
    }
  }
}
function finish() {
  S.finished = true;
  if (S.pendingFollow && S.follow) { const n = S.pendingFollow; S.pendingFollow = null; setTimeout(() => load(n, true), 2500); }
}

// ---------------------------------------------------------------- playback
function resetView() {
  Object.assign(S, { events: [], next: 0, cursor: 0, busy: false, job: null, plan: null, score: null, terms: [], regexes: [], page: null, pageIdx: {}, pageText: {}, claudeSince: null, finished: false, docx: null });
  resetRail();
  $("#feed").innerHTML = ""; $("#terms").innerHTML = ""; $("#jd").textContent = ""; $("#scorebox").innerHTML = "";
  $("#coverage").textContent = ""; $("#stage").textContent = ""; $("#jtitle").textContent = "Loading…"; $("#jsub").textContent = "";
  $("#tabReal").disabled = true; $("#openWord").disabled = true; showLive();
}
async function load(name, animate) {
  resetView();
  S.name = name;
  S.instant = !animate;
  renderPicker();
  await pull();
  if (S.instant) { while (S.cursor < S.events.length) apply(S.events[S.cursor++], false); S.instant = false; }
}
async function pull() {
  if (!S.name) return;
  try {
    const r = await api(`/api/run?name=${encodeURIComponent(S.name)}&from=${S.next}`);
    S.events.push(...r.events); S.next = r.next;
  } catch (_) { /* a run that vanished just stops updating */ }
}
function tick() {
  if (S.stopAt != null && S.cursor >= S.stopAt) return;
  if (!S.busy && S.cursor < S.events.length) {
    const e = S.events[S.cursor++];
    apply(e, true);
    S.busy = true;
    setTimeout(() => { S.busy = false; }, (DELAY[e.step] ?? 600) / S.speed);
  }
  if (S.claudeSince && S.cursor >= S.events.length) {
    const el = $("#st-claude .t");
    if (el) el.textContent = `${Math.max(0, Date.now() / 1000 - S.claudeSince).toFixed(0)}s`;
  }
}
function skipToEnd() {
  while (S.cursor < S.events.length) apply(S.events[S.cursor++], false);
  if (S.page) renderPaper(S.page, false);
}

// ---------------------------------------------------------------- runs
const fresh = (r) => r.status === "running" || (r.started && Date.now() / 1000 - r.started < 180);
function runLabel(r) {
  const t = r.started ? new Date(r.started * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
  const out = r.status === "running" ? "building…" : r.status === "error" ? "error" : r.status === "stalled" ? "stopped" :
    r.status === "skipped" ? `${r.score} · below bar` : `${r.score} ✓${r.alert === false ? " (alert failed)" : ""}`;
  return `${t} · ${r.company} — ${r.title} · ${out}`;
}
function renderPicker() {
  const sel = $("#runs");
  const opts = [`<option value="__follow">● Follow new jobs (live)</option>`].concat(
    S.runs.map((r) => `<option value="${esc(r.name)}">${esc(runLabel(r))}</option>`));
  sel.innerHTML = opts.join("");
  sel.value = S.follow ? "__follow" : S.name || "__follow";
  $("#live").classList.toggle("on", S.follow);
}
async function refreshRuns() {
  try { S.runs = (await api("/api/runs")).runs; } catch (_) { return; }
  const keep = document.activeElement === $("#runs");
  if (!keep) renderPicker();
  if (!S.follow) return;
  const newest = S.runs[0];
  if (!newest) { showEmpty(); return; }
  if (newest.name === S.name) return;
  if (!S.name || S.finished) load(newest.name, fresh(newest));
  else S.pendingFollow = newest.name;
  banner(S.name && !fresh(newest) ? "" : "");
}
function showEmpty() {
  if (S.name) return;
  $("#jtitle").textContent = "Waiting for the first new job…";
  $("#paper").innerHTML = `<div class="wait"><div class="spinner"></div><div>The watcher records every posting it scores here.<br>Leave this tab open — the next one plays live.</div></div>`;
}
function banner(text) { $("#banner").textContent = text; $("#banner").classList.toggle("show", !!text); }
function showLive() { $("#real").hidden = true; $("#paper").hidden = false; $("#tabLive").classList.add("on"); $("#tabReal").classList.remove("on"); }

// ---------------------------------------------------------------- wiring
$("#runs").addEventListener("change", (ev) => {
  const v = ev.target.value;
  if (v === "__follow") { S.follow = true; S.name = null; refreshRuns(); }
  else { S.follow = false; load(v, true); }
  renderPicker();
});
document.querySelectorAll("#speeds [data-speed]").forEach((b) => b.addEventListener("click", () => {
  S.speed = Number(b.dataset.speed);
  document.querySelectorAll("#speeds [data-speed]").forEach((x) => x.classList.toggle("on", x === b));
}));
$("#skip").addEventListener("click", skipToEnd);
$("#replay").addEventListener("click", () => { if (S.name) { const n = S.name; load(n, true); } });
$("#tabLive").addEventListener("click", showLive);
$("#tabReal").addEventListener("click", () => {
  $("#paper").hidden = true; $("#real").hidden = false;
  $("#tabReal").classList.add("on"); $("#tabLive").classList.remove("on");
  const want = `/api/png?name=${encodeURIComponent(S.name)}`;
  if ($("#real").dataset.src !== want) { $("#real").dataset.src = want; $("#real").alt = "Rendering the .docx with Quick Look…"; $("#real").src = want; }
});
$("#openWord").addEventListener("click", () => api(`/api/open?name=${encodeURIComponent(S.name)}`, { method: "POST" }).catch(() => {}));
document.addEventListener("mouseover", (ev) => {
  const chip = ev.target.closest(".chip[data-t]");
  document.querySelectorAll("mark.hot, .chip.hot").forEach((m) => m.classList.remove("hot"));
  if (chip) document.querySelectorAll(`mark[data-t="${chip.dataset.t}"], .chip[data-t="${chip.dataset.t}"]`).forEach((m) => m.classList.add("hot"));
});

(async function start() {
  resetRail();
  document.querySelectorAll("#speeds [data-speed]").forEach((x) => x.classList.toggle("on", Number(x.dataset.speed) === S.speed));
  await refreshRuns();
  const want = params.get("run");
  if (want) {
    S.follow = false;
    const step = params.get("step");
    if (step != null) { await load(want, false); }
    else await load(want, true);
    if (step != null) {
      resetView(); S.name = want; await pull(); S.stopAt = Number(step);
      while (S.cursor < S.stopAt && S.cursor < S.events.length) apply(S.events[S.cursor++], false);
    }
    renderPicker();
  }
  setInterval(tick, 100);
  setInterval(pull, 900);
  setInterval(refreshRuns, 2500);
})();
</script>
</body>
</html>
